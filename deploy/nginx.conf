# Nginx + PHP-FPM alternative: /etc/nginx/sites-available/feedbackhub
server {
    listen 80;
    server_name feedbackhub.yourdomain.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name feedbackhub.yourdomain.com;
    root /var/www/feedback-system;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/feedbackhub.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedbackhub.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Block hidden files and private folders (same rules as .htaccess)
    location ~ /\.                                  { deny all; return 404; }
    location ~ ^/(config|includes|database|storage|tests|deploy|docs)/ { deny all; return 404; }
    location ~ \.(sql|md|log|sh|json)$              { deny all; return 404; }

    error_page 404 /errors/404.php;
    error_page 403 /errors/403.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
