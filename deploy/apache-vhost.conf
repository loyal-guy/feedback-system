# Apache virtual host for a VPS (Ubuntu): /etc/apache2/sites-available/feedbackhub.conf
# Enable with: sudo a2ensite feedbackhub && sudo a2enmod rewrite headers ssl && sudo systemctl reload apache2
# Then get a free certificate: sudo certbot --apache -d feedbackhub.yourdomain.com

<VirtualHost *:80>
    ServerName feedbackhub.yourdomain.com
    Redirect permanent / https://feedbackhub.yourdomain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName feedbackhub.yourdomain.com
    DocumentRoot /var/www/feedback-system

    <Directory /var/www/feedback-system>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/feedbackhub.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/feedbackhub.yourdomain.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    ErrorLog  ${APACHE_LOG_DIR}/feedbackhub_error.log
    CustomLog ${APACHE_LOG_DIR}/feedbackhub_access.log combined
</VirtualHost>
