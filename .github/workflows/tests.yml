name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, curl, mbstring
      - name: Create the database
        run: mysql -h 127.0.0.1 -uroot -prootpass < database/schema.sql
      - name: Create .env for testing
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=development/; s/^DB_USER=.*/DB_USER=root/; s/^DB_PASS=.*/DB_PASS=rootpass/' .env
      - name: Start the web server
        run: |
          php -S 127.0.0.1:8000 deploy/router.php > server.log 2>&1 &
          sleep 2
      - name: Run the test suite
        run: php tests/run_tests.php http://127.0.0.1:8000
      - name: Save the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            tests/TEST_REPORT.md
            tests/results.json
